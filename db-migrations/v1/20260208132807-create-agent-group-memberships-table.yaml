databaseChangeLog:
  - changeSet:
      id: 20260208132807-create-agent-group-memberships-table
      author: giovannibaratta
      changes:
        - createTable:
            tableName: agent_group_memberships
            columns:
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: group_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: agent_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: agent_group_memberships
            columnNames: organization_id, group_id, agent_id
            constraintName: pk_agent_group_memberships
        - addForeignKeyConstraint:
            baseTableName: agent_group_memberships
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_agent_group_memberships_organization
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addForeignKeyConstraint:
            baseTableName: agent_group_memberships
            baseColumnNames: organization_id, group_id
            referencedTableName: groups
            referencedColumnNames: organization_id, id
            constraintName: fk_agent_group_memberships_group
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addForeignKeyConstraint:
            baseTableName: agent_group_memberships
            baseColumnNames: organization_id, agent_id
            referencedTableName: agents
            referencedColumnNames: organization_id, id
            constraintName: fk_agent_group_memberships_agent
            onDelete: RESTRICT
            onUpdate: NO ACTION
