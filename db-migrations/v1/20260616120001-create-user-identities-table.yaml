databaseChangeLog:
  - changeSet:
      id: 20260616120001-create-user-identities-table
      author: giovannibaratta
      changes:
        - createTable:
            tableName: platform_account_identities
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: provider_connection_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: issuer
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: occ
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: platform_account_identities
            baseColumnNames: account_id
            referencedTableName: platform_accounts
            referencedColumnNames: id
            constraintName: fk_platform_account_identities_account
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addForeignKeyConstraint:
            baseTableName: platform_account_identities
            baseColumnNames: provider_connection_id
            referencedTableName: provider_connections
            referencedColumnNames: id
            constraintName: fk_platform_account_identities_provider
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addUniqueConstraint:
            tableName: platform_account_identities
            columnNames: provider_connection_id, issuer, subject
            constraintName: platform_account_identities_provider_subject_unique
        - addUniqueConstraint:
            tableName: platform_account_identities
            columnNames: account_id, provider_connection_id
            constraintName: platform_account_identities_account_provider_unique
