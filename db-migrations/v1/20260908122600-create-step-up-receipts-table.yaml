databaseChangeLog:
  - changeSet:
      id: 20260908122600-create-step-up-receipts-table
      author: giovannibaratta
      changes:
        - createTable:
            tableName: step_up_receipts
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: jti
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: session_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: provider_connection_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: context_version
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: operation
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: resource_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: step_up_receipts
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_step_up_receipts_organization
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addForeignKeyConstraint:
            baseTableName: step_up_receipts
            baseColumnNames: organization_id, user_id
            referencedTableName: users
            referencedColumnNames: organization_id, id
            constraintName: fk_step_up_receipts_user
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addForeignKeyConstraint:
            baseTableName: step_up_receipts
            baseColumnNames: session_id, provider_connection_id
            referencedTableName: browser_sessions
            referencedColumnNames: id, provider_connection_id
            constraintName: fk_step_up_receipts_session_provider
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addUniqueConstraint:
            tableName: step_up_receipts
            columnNames: organization_id, id
            constraintName: step_up_receipts_organization_id_unique
        - addUniqueConstraint:
            tableName: step_up_receipts
            columnNames: organization_id, jti
            constraintName: step_up_receipts_organization_jti_unique
