databaseChangeLog:
  - changeSet:
      id: 20260208132756-create-agents-table
      author: giovannibaratta
      changes:
        - createTable:
            tableName: agents
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: agent_name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: base64_public_key
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: roles
                  type: jsonb
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: occ
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: agents
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_agents_organization
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addUniqueConstraint:
            tableName: agents
            columnNames: organization_id, id
            constraintName: agents_organization_id_unique
        - addUniqueConstraint:
            tableName: agents
            columnNames: organization_id, agent_name
            constraintName: agents_organization_name_unique
