databaseChangeLog:
  - changeSet:
      id: 20260908121400-create-durable-work-table
      author: giovannibaratta
      comment: Shared tenant-owned execution state for concrete workflow action tasks.
      changes:
        - insert:
            tableName: approvio_security_table_registry
            columns:
              - column:
                  name: table_name
                  value: durable_work
              - column:
                  name: security_class
                  value: tenant
              - column:
                  name: capability_profile
                  value: tenant_worker
        - createTable:
            tableName: durable_work
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: kind
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: lease_owner
                  type: uuid
              - column:
                  name: lease_until
                  type: timestamptz
              - column:
                  name: fencing
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: available_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: occ
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: durable_work
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_durable_work_organization
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addUniqueConstraint:
            tableName: durable_work
            columnNames: organization_id, id
            constraintName: durable_work_organization_id_unique
        - createIndex:
            tableName: durable_work
            indexName: idx_durable_work_organization_available
            columns:
              - column:
                  name: organization_id
              - column:
                  name: available_at
              - column:
                  name: id
