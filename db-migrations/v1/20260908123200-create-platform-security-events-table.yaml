databaseChangeLog:
  - changeSet:
      id: 20260908123200-create-platform-security-events-table
      author: giovannibaratta
      changes:
        - insert:
            tableName: approvio_security_table_registry
            columns:
              - column:
                  name: table_name
                  value: platform_security_events
              - column:
                  name: security_class
                  value: platform
              - column:
                  name: capability_profile
                  value: platform_security_events
        - createTable:
            tableName: platform_security_events
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: actor_type
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: actor_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: text
              - column:
                  name: metadata
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: timestamptz
                  constraints:
                    nullable: false
