databaseChangeLog:
  - changeSet:
      id: 20260830120003-create-usage-events-table
      author: giovannibaratta
      changes:
        - createTable:
            tableName: usage_events
            columns:
              - column:
                  name: event_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: entity_type
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: actor_type
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: actor_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: actor_display_name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: metric
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: is_billable
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: metadata
                  type: jsonb
        - addForeignKeyConstraint:
            baseTableName: usage_events
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_usage_events_organization
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addUniqueConstraint:
            tableName: usage_events
            columnNames: organization_id, event_id
            constraintName: usage_events_organization_event_unique
        - createIndex:
            tableName: usage_events
            indexName: idx_usage_events_organization_metric_time
            columns:
              - column:
                  name: organization_id
              - column:
                  name: metric
              - column:
                  name: occurred_at
