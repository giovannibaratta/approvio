databaseChangeLog:
  - changeSet:
      id: 20260908120200-create-provider-connections-table
      author: giovannibaratta
      changes:
        - createTable:
            tableName: provider_connections
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: trust_scope
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: issuer
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: config_reference
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
