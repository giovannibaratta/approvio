databaseChangeLog:
  - changeSet:
      id: 20260208132754-create-groups-table
      author: giovannibaratta
      changes:
        - createTable:
            tableName: groups
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: occ
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: groups
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_groups_organization
            onDelete: RESTRICT
            onUpdate: NO ACTION
        # PostgreSQL requires the referenced key of a composite foreign key to be unique. This
        # permits child tables to reference (organization_id, id), which proves that related rows
        # belong to the same organization. `id` remains globally unique; this supporting index is
        # retained solely for tenant-matching foreign keys.
        - addUniqueConstraint:
            tableName: groups
            columnNames: organization_id, id
            constraintName: groups_organization_id_unique
        - addUniqueConstraint:
            tableName: groups
            columnNames: organization_id, name
            constraintName: groups_organization_name_unique
