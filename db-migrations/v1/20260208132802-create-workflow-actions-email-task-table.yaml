databaseChangeLog:
  - changeSet:
      id: 20260208132802-create-workflow-actions-email-task-table
      author: giovannibaratta
      changes:
        - createTable:
            tableName: workflow_actions_email_task
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: workflow_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: event_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: action_index
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: initiating_actor_type
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: initiating_actor_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: initiating_actor_display_name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: enc_payload
                  type: text
                  remarks: Tenant-bound encrypted dispatch payload.
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: lease_owner
                  type: text
              - column:
                  name: lease_until
                  type: timestamptz
              - column:
                  name: fencing
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: available_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: occ
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: workflow_actions_email_task
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_workflow_actions_email_task_organization
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addForeignKeyConstraint:
            baseTableName: workflow_actions_email_task
            baseColumnNames: organization_id, workflow_id
            referencedTableName: workflows
            referencedColumnNames: organization_id, id
            constraintName: fk_workflow_actions_email_task_workflow
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addUniqueConstraint:
            tableName: workflow_actions_email_task
            columnNames: organization_id, id
            constraintName: workflow_actions_email_task_organization_id_unique
        - addUniqueConstraint:
            tableName: workflow_actions_email_task
            columnNames: organization_id, event_id, action_index
            constraintName: workflow_actions_email_task_organization_event_action_unique
