databaseChangeLog:
  - changeSet:
      id: 20260908120000-create-organizations-table
      author: giovannibaratta
      changes:
        - insert:
            tableName: approvio_security_table_registry
            columns:
              - column:
                  name: table_name
                  value: organizations
              - column:
                  name: security_class
                  value: organization
              - column:
                  name: capability_profile
                  value: organization
        - createTable:
            tableName: organizations
            remarks: Organization tombstones are retained; physical deletion is disabled pending a retention policy.
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: slug
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: plan_tier
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: suspension_reason
                  type: text
              - column:
                  name: grace_until
                  type: timestamptz
              - column:
                  name: occ
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: organizations
            columnNames: slug
            constraintName: organizations_slug_unique
