databaseChangeLog:
  - changeSet:
      id: 20260208132758-create-spaces-table
      author: giovannibaratta
      changes:
        - createTable:
            tableName: spaces
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: occ
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: spaces
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_spaces_organization
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addUniqueConstraint:
            tableName: spaces
            columnNames: organization_id, id
            constraintName: spaces_organization_id_unique
        - addUniqueConstraint:
            tableName: spaces
            columnNames: organization_id, name
            constraintName: spaces_organization_name_unique
