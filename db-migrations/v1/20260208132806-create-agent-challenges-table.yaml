databaseChangeLog:
  - changeSet:
      id: 20260208132806-create-agent-challenges-table
      author: giovannibaratta
      changes:
        - createTable:
            tableName: agent_challenges
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: agent_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: nonce
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: occ
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: agent_challenges
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_agent_challenges_organization
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addForeignKeyConstraint:
            baseTableName: agent_challenges
            baseColumnNames: organization_id, agent_id
            referencedTableName: agents
            referencedColumnNames: organization_id, id
            constraintName: fk_agent_challenges_agent
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addUniqueConstraint:
            tableName: agent_challenges
            columnNames: organization_id, id
            constraintName: agent_challenges_organization_id_unique
        - addUniqueConstraint:
            tableName: agent_challenges
            columnNames: organization_id, nonce
            constraintName: agent_challenges_organization_nonce_unique
