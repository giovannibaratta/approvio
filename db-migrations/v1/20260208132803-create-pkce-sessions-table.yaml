databaseChangeLog:
  - changeSet:
      id: 20260208132803-create-pkce-sessions-table
      author: giovannibaratta
      changes:
        - createTable:
            tableName: pkce_sessions
            columns:
              - column:
                  name: state
                  type: text
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: enc_code_verifier
                  type: text
                  remarks: Platform-bound encrypted PKCE verifier.
                  constraints:
                    nullable: false
              - column:
                  name: redirect_uri
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: oidc_state
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: provider_connection_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: flow
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: session_id
                  type: uuid
              - column:
                  name: step_up_organization_id
                  type: uuid
              - column:
                  name: step_up_operation
                  type: text
              - column:
                  name: step_up_resource_id
                  type: uuid
              - column:
                  name: step_up_context_version
                  type: bigint
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: timestamptz
              - column:
                  name: occ
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: pkce_sessions
            baseColumnNames: provider_connection_id
            referencedTableName: provider_connections
            referencedColumnNames: id
            constraintName: fk_pkce_sessions_provider
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addForeignKeyConstraint:
            baseTableName: pkce_sessions
            baseColumnNames: session_id, provider_connection_id
            referencedTableName: browser_sessions
            referencedColumnNames: id, provider_connection_id
            constraintName: fk_pkce_sessions_session_provider
            onDelete: RESTRICT
            onUpdate: NO ACTION
        - addForeignKeyConstraint:
            baseTableName: pkce_sessions
            baseColumnNames: step_up_organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_pkce_sessions_step_up_organization
            onDelete: RESTRICT
            onUpdate: NO ACTION
        # TODO: Why this is not expressed why native liquibase constraints
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: >-
              ALTER TABLE pkce_sessions ADD CONSTRAINT pkce_sessions_flow_check CHECK
              ((flow = 'initial_login' AND session_id IS NULL AND step_up_organization_id IS NULL
              AND step_up_operation IS NULL AND step_up_resource_id IS NULL AND step_up_context_version IS NULL)
              OR (flow = 'step_up' AND session_id IS NOT NULL AND step_up_organization_id IS NOT NULL
              AND step_up_operation IS NOT NULL AND step_up_resource_id IS NOT NULL AND step_up_context_version IS NOT NULL))
